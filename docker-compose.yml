version: '3.8'

services:
  backend:
    build: ./backend
    container_name: saasify-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - backend_data:/app
    restart: always

  frontend:
    build: ./frontend
    container_name: saasify-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
